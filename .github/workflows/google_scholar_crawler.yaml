name: Get Citation Data

on:
  workflow_dispatch:
  page_build:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Install requirements
      run: pip install -r google_scholar_crawler/requirements.txt
    - name: Fetch and publish citation data
      run: |
        cd ./google_scholar_crawler
        python3 main.py
        cd ./results
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: "CxKy4lEAAAAJ"
