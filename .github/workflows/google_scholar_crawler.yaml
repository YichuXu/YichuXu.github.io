name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
  schedule:
    # Run every day at 08:17 UTC (16:17 Beijing time). Using a non-zero
    # minute avoids the busiest period for GitHub's scheduled runners.
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Install requirements
      run: pip install -r google_scholar_crawler/requirements.txt
    - name: Fetch and publish citation data
      run: |
        cd ./google_scholar_crawler
        python3 main.py
        cd ./results
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: "CxKy4lEAAAAJ"
